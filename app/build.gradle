plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sp3000remote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.sp3000remote'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    sourceSets { main.res.srcDir "$buildDir/generated/dapIconRes" }
}

def out = file("$buildDir/generated/dapIconRes")
tasks.register('generateDapIcons') {
    doLast {
        def d = new File(out, 'drawable'); d.mkdirs()
        def m = new File(out, 'mipmap-anydpi-v26'); m.mkdirs()

        new File(d,'ic_launcher_background.xml').text = '''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:type="radial" android:centerX="50%" android:centerY="44%" android:gradientRadius="88dp" android:startColor="#36414C" android:centerColor="#28313A" android:endColor="#151A20"/>
        </shape>'''

        // Android adaptive foreground: tall, narrow SP4000-style silhouette kept inside the adaptive-icon safe zone.
        new File(d,'ic_launcher_foreground.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#030405" android:pathData="M35,13 L69,13 L69,20 L77,31 L73,40 L73,48 C79,49 82,52 82,57 C82,62 79,65 73,66 L73,72 L77,82 L72,94 L35,94 Z"/>
            <path android:fillColor="#030405" android:pathData="M31,33 L35,33 L35,38 L31,38 Z M31,42 L35,42 L35,47 L31,47 Z M31,51 L35,51 L35,56 L31,56 Z"/>
            <path android:fillColor="#0B0D10" android:pathData="M73,48 C80,49 82,52 82,57 C82,62 80,65 73,66 Z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#D3D8DE" android:strokeWidth="1.05" android:pathData="M35,13 L69,13 L77,31 M35,13 L35,94 L72,94 M72,94 L77,82 M73,40 L73,48 M73,66 L73,72"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#77808A" android:strokeWidth="0.7" android:pathData="M77,31 L73,40 M77,82 L72,94"/>
        </vector>'''

        // In-app hero follows the user's reference: long rectangular body, crisp silver edge, 3 left keys and right crown/facets.
        new File(d,'ic_dap_hero.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="172dp" android:height="220dp" android:viewportWidth="172" android:viewportHeight="220">
            <path android:fillColor="#020304" android:pathData="M48,7 L116,7 L116,19 L129,40 L121,53 L121,75 C130,77 134,83 134,92 C134,101 130,107 121,109 L121,130 L129,158 L122,177 L116,213 L48,213 Z"/>
            <path android:fillColor="#020304" android:pathData="M40,48 L48,48 L48,57 L40,57 Z M40,65 L48,65 L48,74 L40,74 Z M40,82 L48,82 L48,91 L40,91 Z"/>
            <path android:fillColor="#0A0D11" android:pathData="M121,75 C130,77 134,83 134,92 C134,101 130,107 121,109 Z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#D7DCE2" android:strokeWidth="1.6" android:pathData="M48,7 L116,7 L129,40 M48,7 L48,213 L116,213 M116,213 L122,177 M121,53 L121,75 M121,109 L121,130"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#7F8791" android:strokeWidth="1" android:pathData="M129,40 L121,53 M129,158 L122,177"/>
        </vector>'''

        // Android notification small icon: pure opaque white silhouette, transparent background.
        new File(d,'ic_dap_notification.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFFFF" android:pathData="M35,13 L69,13 L69,20 L77,31 L73,40 L73,48 C79,49 82,52 82,57 C82,62 79,65 73,66 L73,72 L77,82 L72,94 L35,94 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M31,33 L35,33 L35,38 L31,38 Z M31,42 L35,42 L35,47 L31,47 Z M31,51 L35,51 L35,56 L31,56 Z"/>
        </vector>'''

        // Reference-matched 32dp media glyphs. All are intentionally the same visual weight/size.
        new File(d,'ic_prev.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M5,8 H8 V24 H5 Z M9,16 L24,7 V25 Z"/></vector>'''
        new File(d,'ic_play_pause.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M5,7 L17,16 L5,25 Z M20,7 H24 V25 H20 Z M26,7 H30 V25 H26 Z"/></vector>'''
        new File(d,'ic_next.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M24,8 H27 V24 H24 Z M8,7 L23,16 L8,25 Z"/></vector>'''
        new File(d,'ic_minus.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M7,14 H25 V18 H7 Z"/></vector>'''
        new File(d,'ic_plus.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M14,7 H18 V14 H25 V18 H18 V25 H14 V18 H7 V14 H14 Z"/></vector>'''
        new File(d,'ic_power.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#FFFFFFFF" android:pathData="M14.5,3 H17.5 V16 H14.5 Z"/><path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:pathData="M9,7 C5.8,9.2 4,12.5 4,16 C4,22.6 9.4,28 16,28 C22.6,28 28,22.6 28,16 C28,12.5 26.2,9.2 23,7"/></vector>'''
        new File(d,'ic_back.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M13,8 L6,15 L13,22 M7,15 H20 C25,15 28,18 28,22 C28,26 25,29 20,29 H11"/></vector>'''

        def a = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/><monochrome android:drawable="@drawable/ic_dap_notification"/></adaptive-icon>'
        new File(m,'ic_launcher.xml').text = a
        new File(m,'ic_launcher_round.xml').text = a
    }
}

tasks.register('patchDapManifest') {
    doLast {
        def f = file('src/main/AndroidManifest.xml')
        def s = f.getText('UTF-8')
        if (!s.contains('android.permission.RECEIVE_BOOT_COMPLETED')) {
            s = s.replace('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />', '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />')
        }
        if (!s.contains('android:icon="@mipmap/ic_launcher"')) {
            s = s.replace('<application android:allowBackup="true" android:label="@string/app_name" android:theme="@style/AppTheme">', '<application android:allowBackup="true" android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/AppTheme">')
        }
        s = s.replace('android:icon="@android:drawable/ic_media_play"', 'android:icon="@drawable/ic_dap_notification"')
        if (!s.contains('android:name=".AutoStartReceiver"')) {
            s = s.replace('    </application>', '        <receiver android:name=".AutoStartReceiver" android:enabled="true" android:exported="false">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.bluetooth.adapter.action.STATE_CHANGED" />\n            </intent-filter>\n        </receiver>\n    </application>')
        }
        f.write(s, 'UTF-8')
    }
}

preBuild.dependsOn generateDapIcons, patchDapManifest

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sp3000remote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.sp3000remote'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    sourceSets { main.res.srcDir "$buildDir/generated/dapIconRes" }
}

def out = file("$buildDir/generated/dapIconRes")
tasks.register('generateDapIcons') {

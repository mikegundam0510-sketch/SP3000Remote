        new File(d,'ic_play_pause.xml').text = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M4,5 L11,12 L4,19 Z M14,5 H17 V19 H14 Z M19,5 H22 V19 H19 Z"/></vector>'''
